<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de CGs de Historia - Stella Sora</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d0f14;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #161922;
            padding: 18px 32px;
            border-bottom: 1px solid #282e3f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 {
            font-size: 22px;
            color: #63b3ed;
            letter-spacing: 0.5px;
        }
        .badge {
            background: #2b6cb0;
            color: #fff;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 13px;
        }
        .container {
            flex: 1;
            padding: 32px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }
        .cg-card {
            background: #161922;
            border: 1px solid #282e3f;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }
        .cg-card:hover {
            transform: translateY(-5px);
            border-color: #63b3ed;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .cg-thumb {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: #000;
        }
        .cg-info {
            padding: 12px 16px;
            font-size: 12px;
            color: #a0aec0;
            border-top: 1px solid #282e3f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Modal Lightbox */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #modal.active { display: flex; }
        #modal img {
            max-width: 95vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        #modal-caption {
            margin-top: 14px;
            color: #e2e8f0;
            font-size: 14px;
        }
        .modal-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            padding: 14px 20px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .modal-btn:hover { background: rgba(255, 255, 255, 0.35); }
        #close-btn { top: 20px; right: 30px; font-size: 28px; width: 50px; height: 50px; padding: 0; line-height: 50px; text-align: center; }
        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }
    </style>
</head>

        const modalImg = document.getElementById('modal-img');
        const modalCaption = document.getElementById('modal-caption');
        let currentIndex = 0;

        cgs.forEach((cg, idx) => {
            const card = document.createElement('div');
            card.className = 'cg-card';
            card.innerHTML = `
                <img class="cg-thumb" src="${cg.path}" loading="lazy" alt="${cg.filename}">
                <div class="cg-info">${cg.filename}</div>
            `;
            card.onclick = () => openModal(idx);
            gallery.appendChild(card);
        });

        function openModal(idx) {
            currentIndex = idx;
            modalImg.src = cgs[idx].path;
            modalCaption.textContent = `(${idx + 1}/${cgs.length}) - ${cgs[idx].filename}`;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function nextCG() {
            currentIndex = (currentIndex + 1) % cgs.length;
            openModal(currentIndex);
        }

        function prevCG() {
            currentIndex = (currentIndex - 1 + cgs.length) % cgs.length;
            openModal(currentIndex);
        }

        document.getElementById('close-btn').onclick = closeModal;
        document.getElementById('next-btn').onclick = nextCG;
        document.getElementById('prev-btn').onclick = prevCG;
        modal.onclick = (e) => { if (e.target === modal) closeModal(); };

        window.onkeydown = (e) => {
            if (!modal.classList.contains('active')) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowRight') nextCG();
            if (e.key === 'ArrowLeft') prevCG();
        };
